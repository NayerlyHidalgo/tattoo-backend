services:
  - type: web
    name: tattoo-backend-api
    env: node
    region: oregon
    plan: free

    rootDir: .
    buildCommand: NODE_ENV=development npm ci --force && npx tsc --skipLibCheck || true && node fix-modules.js
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
    autoDeploy: true
