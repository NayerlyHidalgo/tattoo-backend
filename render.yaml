services:
  - type: web
    name: tattoo-backend-api
    env: node
    region: oregon
    plan: free

    rootDir: .
    buildCommand: NODE_ENV=development npm ci && NODE_OPTIONS=--max_old_space_size=2048 npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
    autoDeploy: true
